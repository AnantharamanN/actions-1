name: Run ASCII script

on: push

jobs: 
  ascii_job:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v6

    - name: List files
      run: ls -lrta
      
    - name: Executing shell script
      run: | 
        chmod +x ascii-script.sh
        ./ascii-script.sh